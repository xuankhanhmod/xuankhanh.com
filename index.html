    <script>

        /* =========================
           LOADING
           ========================= */

        window.addEventListener("load", function () {

            setTimeout(function () {

                document
                    .getElementById("loading")
                    .classList
                    .add("hide");

            }, 2300);

        });


        /* =========================
           ĐỒNG HỒ
           ========================= */

        function updateClock() {

            const now = new Date();

            const h =
                String(now.getHours()).padStart(2, "0");

            const m =
                String(now.getMinutes()).padStart(2, "0");

            const s =
                String(now.getSeconds()).padStart(2, "0");


            document.getElementById("clockTime")
                .textContent =
                h + ":" + m + ":" + s;


            const days = [
                "Chủ nhật",
                "Thứ hai",
                "Thứ ba",
                "Thứ tư",
                "Thứ năm",
                "Thứ sáu",
                "Thứ bảy"
            ];


            const day =
                days[now.getDay()];

            const date =
                String(now.getDate()).padStart(2, "0");

            const month =
                String(now.getMonth() + 1).padStart(2, "0");

            const year =
                now.getFullYear();


            document.getElementById("clockDate")
                .textContent =
                day + " • " +
                date + "/" +
                month + "/" +
                year;

        }


        updateClock();

        setInterval(updateClock, 1000);


        /* =========================
           TẠO MƯA XANH
           ========================= */

        const rain =
            document.getElementById("rain");


        for (let i = 0; i < 110; i++) {

            const drop =
                document.createElement("div");

            drop.className = "drop";

            drop.style.left =
                Math.random() * 100 + "%";

            drop.style.height =
                (35 + Math.random() * 55) + "px";

            drop.style.animationDuration =
                (0.45 + Math.random() * 0.75) + "s";

            drop.style.animationDelay =
                Math.random() * 2 + "s";

            drop.style.opacity =
                (0.25 + Math.random() * 0.55);

            rain.appendChild(drop);

        }

    </script>
