html,body{

/* =========================
   LOADING SCREEN
========================= */

#loading{
    position:fixed;
    inset:0;
    z-index:9999;
    background:
        radial-gradient(circle at center,#08345c 0%,#031322 45%,#01060d 100%);
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    transition:opacity .8s ease,visibility .8s ease;
}

#loading.hide{
    opacity:0;
    visibility:hidden;
}

.loading-title{
    font-size:clamp(25px,5vw,55px);
    font-weight:800;
    letter-spacing:4px;
    text-align:center;
    text-shadow:
        0 0 10px #008cff,
        0 0 30px #006eff;
}

.loading-sub{
    margin-top:12px;
    color:#8fd8ff;
    font-size:14px;
    letter-spacing:2px;
}

.loading-bar{
    width:min(420px,80%);
    height:8px;
    margin-top:30px;
    border-radius:20px;
    background:rgba(255,255,255,.12);
    overflow:hidden;
    border:1px solid rgba(0,174,255,.35);
}

.loading-progress{
    width:0%;
    height:100%;
    background:linear-gradient(90deg,#008cff,#00d9ff);
    box-shadow:0 0 15px #00aaff;
    transition:width .15s linear;
}

.loading-percent{
    margin-top:12px;
    color:#67cfff;
    font-size:14px;
}

/* =========================
   MAIN
========================= */

#main{
    min-height:100vh;
    position:relative;
    overflow:hidden;
    padding:90px 20px 60px;
    background:
        radial-gradient(circle at 50% 20%,rgba(0,132,255,.16),transparent 35%),
        linear-gradient(180deg,#03182a,#010914 80%);
}

/* =========================
   BLUE RAIN
========================= */

.rain{
    position:fixed;
    top:-100px;
    width:2px;
    height:70px;
    background:linear-gradient(
        to bottom,
        transparent,
        rgba(0,174,255,.9)
    );
    opacity:.65;
    pointer-events:none;
    z-index:2;
    animation:rainFall linear infinite;
}

@keyframes rainFall{
    from{
        transform:translateY(-100px);
    }
    to{
        transform:translateY(110vh);
    }
}

/* =========================
   SMALL CLOCK
========================= */

.clock-box{
    position:fixed;
    top:15px;
    left:15px;
    z-index:100;
    width:125px;
    padding:8px 10px;
    border-radius:12px;

    background:rgba(2,18,32,.72);
    border:1px solid rgba(0,174,255,.45);

    box-shadow:
        0 0 15px rgba(0,136,255,.18),
        inset 0 0 15px rgba(0,136,255,.05);

    backdrop-filter:blur(8px);
}

.clock-time{

.clock-date{

}

/* =========================

========================= */

.discord{

<script>

/* =========================
   LOADING 0 → 100
========================= */

let progress = 0;

const progressBar =
    document.getElementById("loadingProgress");

const progressText =
    document.getElementById("loadingPercent");

const loading =
    document.getElementById("loading");

const loadingTimer =
    setInterval(() => {

        progress++;

        progressBar.style.width =
            progress + "%";

        progressText.textContent =
            progress + "%";

        if(progress >= 100){

            clearInterval(loadingTimer);

            setTimeout(() => {

                loading.classList.add("hide");

            },500);

        }

    },25);


/* =========================
   CLOCK
========================= */

function updateClock(){

    const now = new Date();

    const hours =
        String(now.getHours()).padStart(2,"0");

    const minutes =
        String(now.getMinutes()).padStart(2,"0");

    const seconds =
        String(now.getSeconds()).padStart(2,"0");

    document.getElementById("clock")
        .textContent =
        `${hours}:${minutes}:${seconds}`;


    const days = [
        "CN",
        "T2",
        "T3",
        "T4",
        "T5",
        "T6",
        "T7"
    ];

    const day =
        days[now.getDay()];

    const date =
        String(now.getDate()).padStart(2,"0");

    const month =
        String(now.getMonth()+1).padStart(2,"0");

    const year =
        now.getFullYear();

    document.getElementById("date")
        .textContent =
        `${day} ${date}/${month}/${year}`;
}

updateClock();

setInterval(updateClock,1000);


/* =========================
   TYPING EFFECT
========================= */

const messages = [
    "HELLO EVERYONE 👋",
    "WELCOME TO XUÂN KHÁNH WEBSITE",
    "HAVE A NICE DAY ✨"
];

let messageIndex = 0;
let charIndex = 0;
let deleting = false;

const typing =
    document.getElementById("typing");

function typeEffect(){

    const text =
        messages[messageIndex];

    if(!deleting){

        typing.textContent =
            text.substring(0,charIndex + 1);

        charIndex++;

        if(charIndex === text.length){

            deleting = true;

            setTimeout(typeEffect,1800);

            return;
        }

    }else{

        typing.textContent =
            text.substring(0,charIndex - 1);

        charIndex--;

        if(charIndex === 0){

            deleting = false;

            messageIndex++;

            if(messageIndex >= messages.length){
                messageIndex = 0;
            }
        }
    }

    setTimeout(
        typeEffect,
        deleting ? 35 : 70
    );
}

typeEffect();


/* =========================
   BLUE RAIN
========================= */

function createRain(){

    const rain =
        document.createElement("div");

    rain.className = "rain";

    rain.style.left =
        Math.random() * 100 + "vw";

    rain.style.height =
        (40 + Math.random()*70) + "px";

    rain.style.opacity =
        (0.25 + Math.random()*0.55);

    rain.style.animationDuration =
        (0.7 + Math.random()*1.2) + "s";

    document.body.appendChild(rain);

    setTimeout(() => {
        rain.remove();
    },2500);
}


/* Tạo mưa liên tục */

setInterval(createRain,70);


/* Tạo thêm một lượng mưa ban đầu */

for(let i=0;i<70;i++){

    setTimeout(
        createRain,
        Math.random()*1800
    );
}

</script>
