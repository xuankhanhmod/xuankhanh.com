```html
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>XUÂN KHÁNH</title>

<style>

/* =====================================================
   CƠ BẢN
===================================================== */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    background:
        radial-gradient(
            circle at center,
            #18313d 0%,
            #071016 50%,
            #000 100%
        );

    color:white;
    font-family:Arial,Helvetica,sans-serif;
}


/* =====================================================
   MƯA TOÀN TRANG
===================================================== */

#rain{
    position:fixed;
    inset:0;

    overflow:hidden;
    pointer-events:none;

    z-index:2;
}

.rain-drop{
    position:absolute;

    top:-100px;

    width:2px;

    background:
        linear-gradient(
            to bottom,
            transparent,
            #008cff
        );

    box-shadow:
        0 0 6px
        rgba(0,150,255,.8);

    animation:
        rainFall
        linear
        infinite;
}

@keyframes rainFall{

    0%{
        transform:
            translateY(-100px)
            translateX(0);
    }

    100%{
        transform:
            translateY(110vh)
            translateX(-80px);
    }
}


/* =====================================================
   ĐỒNG HỒ
   GÓC TRÊN BÊN TRÁI
===================================================== */

#clockBox{

    position:fixed;

    top:18px;
    left:20px;

    width:170px;
    height:105px;

    /*
       QUAN TRỌNG:
       Tất cả nước và mưa bên trong
       đều không được phép chảy ra ngoài.
    */

    overflow:hidden;

    /*
       KHUNG TRẮNG
    */

    border:
        3px solid #ffffff;

    border-radius:18px;

    background:#ffffff;

    z-index:100;

    box-shadow:
        0 0 18px
        rgba(255,255,255,.35);

    transition:
        transform .18s ease;
}


/* =====================================================
   BẦU TRỜI TRẮNG
===================================================== */

#sky{

    position:absolute;

    left:0;
    top:0;

    width:100%;
    height:55%;

    background:
        linear-gradient(
            to bottom,
            #ffffff,
            #f4faff
        );

    z-index:1;

    overflow:hidden;
}


/* =====================================================
   MƯA BÊN TRONG ĐỒNG HỒ
===================================================== */

.clockRain{

    position:absolute;

    top:-20px;

    width:2px;
    height:15px;

    background:
        linear-gradient(
            to bottom,
            transparent,
            #00aaff
        );

    opacity:.75;

    animation:
        clockRainFall
        linear
        infinite;
}

@keyframes clockRainFall{

    from{
        transform:
            translateY(-20px);
    }

    to{
        transform:
            translateY(80px);
    }
}


/* =====================================================
   NƯỚC TRONG ĐỒNG HỒ
===================================================== */

#water{

    position:absolute;

    left:-15%;

    /*
       Nước luôn nằm trong vùng đồng hồ
    */

    bottom:-3px;

    width:130%;

    height:51%;

    background:
        linear-gradient(
            to bottom,
            #20c8ff 0%,
            #008cff 45%,
            #0055cc 100%
        );

    /*
       Mặt nước cong
    */

    border-radius:
        50%
        50%
        0
        0;

    z-index:3;

    /*
       Cho phép nước nghiêng
    */

    transform-origin:
        center center;

    transition:
        transform .15s ease;
}


/* =====================================================
   MẶT SÓNG
===================================================== */

.wave{

    position:absolute;

    left:-5%;

    width:110%;

    height:12px;

    border-top:
        2px solid
        rgba(255,255,255,.75);

    border-radius:50%;
}

.wave.one{

    top:0;

    animation:
        wave1
        1.5s
        linear
        infinite;
}

.wave.two{

    top:7px;

    opacity:.4;

    animation:
        wave2
        2s
        linear
        infinite;
}

@keyframes wave1{

    from{
        transform:
            translateX(-20px);
    }

    to{
        transform:
            translateX(20px);
    }
}

@keyframes wave2{

    from{
        transform:
            translateX(20px);
    }

    to{
        transform:
            translateX(-20px);
    }
}


/* =====================================================
   THUYỀN
===================================================== */

#boat{

    position:absolute;

    left:50%;

    /*
       Đặt thuyền ngay trên mặt nước
    */

    top:-30px;

    font-size:30px;

    transform:
        translateX(-50%)
        rotate(0deg);

    transform-origin:
        center bottom;

    z-index:6;

    transition:
        transform .15s ease;

    filter:
        drop-shadow(
            0 2px 2px
            rgba(0,0,0,.4)
        );
}


/* =====================================================
   ĐỒNG HỒ - GIỜ
===================================================== */

#clock{

    position:absolute;

    left:0;
    top:12px;

    width:100%;

    text-align:center;

    color:#111;

    font-family:monospace;

    font-size:14px;

    font-weight:bold;

    letter-spacing:2px;

    z-index:10;

    text-shadow:
        0 1px 2px
        rgba(255,255,255,.8);
}


/* =====================================================
   TÊN WEBSITE
===================================================== */

#title{

    position:fixed;

    top:50%;
    left:50%;

    transform:
        translate(-50%,-50%);

    text-align:center;

    z-index:10;

    width:90%;
}

#title h1{

    font-size:
        clamp(
            35px,
            8vw,
            80px
        );

    letter-spacing:6px;

    margin-bottom:15px;
}

#title p{

    color:#aaa;

    font-size:11px;

    letter-spacing:5px;
}


/* =====================================================
   MENU
===================================================== */

.menu{

    position:fixed;

    top:22px;

    right:30px;

    z-index:101;

    display:flex;

    gap:25px;
}

.menu button{

    border:0;

    background:transparent;

    color:#aaa;

    cursor:pointer;

    font-size:10px;

    letter-spacing:2px;

    transition:.3s;
}

.menu button:hover{

    color:#fff;

}


/* =====================================================
   NỘI DUNG TRANG
===================================================== */

.page{

    position:fixed;

    inset:0;

    display:none;

    align-items:center;

    justify-content:center;

    text-align:center;

    z-index:20;

    background:
        rgba(0,0,0,.35);
}

.page.active{

    display:flex;
}

.content{

    width:90%;

    max-width:900px;
}

.content h1{

    font-size:
        clamp(
            35px,
            7vw,
            70px
        );

    letter-spacing:5px;
}

.content p{

    margin-top:20px;

    color:#999;

    line-height:2;

    font-size:13px;
}


/* =====================================================
   NÚT QUAY LẠI
===================================================== */

.back{

    display:inline-block;

    margin-top:30px;

    padding:
        12px 25px;

    border:
        1px solid #fff;

    border-radius:30px;

    color:#fff;

    background:transparent;

    cursor:pointer;

    font-size:10px;

    letter-spacing:2px;
}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:600px){

    #clockBox{

        top:15px;
        left:15px;

        width:150px;
        height:94px;
    }

    #clock{

        font-size:12px;
    }

    .menu{

        top:20px;
        right:15px;

        gap:10px;
    }

    .menu button{

        font-size:8px;
    }

}

</style>
</head>


<body>


<!-- =====================================================
     MƯA TOÀN TRANG
===================================================== -->

<div id="rain"></div>


<!-- =====================================================
     ĐỒNG HỒ
===================================================== -->

<div id="clockBox">


    <!-- BẦU TRỜI -->

    <div id="sky"></div>


    <!-- MƯA TRONG ĐỒNG HỒ -->

    <div id="clockRain"></div>


    <!-- NƯỚC -->

    <div id="water">

        <div class="wave one"></div>

        <div class="wave two"></div>


        <!-- THUYỀN -->

        <div id="boat">
            ⛵
        </div>

    </div>


    <!-- GIỜ -->

    <div id="clock">
        00:00:00
    </div>


</div>


<!-- =====================================================
     MENU
===================================================== -->

<nav class="menu">

    <button onclick="showPage('home')">
        MAIN
    </button>

    <button onclick="showPage('about')">
        GIỚI THIỆU
    </button>

    <button onclick="showPage('contact')">
        LIÊN HỆ
    </button>

</nav>


<!-- =====================================================
     TRANG CHÍNH
===================================================== -->

<section
    id="home"
    class="page active">

    <div
        id="title"
        class="content">

        <h1>
            XUÂN KHÁNH
        </h1>

        <p>
            WELCOME TO MY WEBSITE
        </p>

    </div>

</section>


<!-- =====================================================
     GIỚI THIỆU
===================================================== -->

<section
    id="about"
    class="page">

    <div class="content">

        <h1>
            GIỚI THIỆU
        </h1>

        <p>
            Chào mừng bạn đến với
            website XUÂN KHÁNH.
            <br><br>
            Đây là trang web được
            thiết kế với hiệu ứng
            mưa, nước và đồng hồ
            tương tác.
        </p>

        <button
            class="back"
            onclick="showPage('home')">

            QUAY LẠI

        </button>

    </div>

</section>


<!-- =====================================================
     LIÊN HỆ
===================================================== -->

<section
    id="contact"
    class="page">

    <div class="content">

        <h1>
            LIÊN HỆ
        </h1>

        <p>
            XUÂN KHÁNH
        </p>

        <button
            class="back"
            onclick="showPage('home')">

            QUAY LẠI

        </button>

    </div>

</section>


<script>

/* =====================================================
   MƯA TOÀN TRANG
===================================================== */

const rain =
    document.getElementById("rain");


for(let i = 0; i < 180; i++){

    const drop =
        document.createElement("div");


    drop.className =
        "rain-drop";


    drop.style.left =
        Math.random() * 100 + "%";


    drop.style.height =
        (
            25 +
            Math.random() * 50
        ) + "px";


    drop.style.animationDuration =
        (
            .45 +
            Math.random() * .8
        ) + "s";


    drop.style.animationDelay =
        Math.random() * 2 + "s";


    drop.style.opacity =
        .25 +
        Math.random() * .75;


    rain.appendChild(drop);

}


/* =====================================================
   MƯA TRONG ĐỒNG HỒ
===================================================== */

const clockRain =
    document.getElementById(
        "clockRain"
    );


for(let i = 0; i < 28; i++){

    const drop =
        document.createElement("div");


    drop.className =
        "clockRain";


    drop.style.left =
        Math.random() * 100 + "%";


    drop.style.height =
        (
            8 +
            Math.random() * 12
        ) + "px";


    drop.style.animationDuration =
        (
            .5 +
            Math.random() * .8
        ) + "s";


    drop.style.animationDelay =
        Math.random() * 1.5 + "s";


    clockRain.appendChild(drop);

}


/* =====================================================
   ĐỒNG HỒ THỜI GIAN
===================================================== */

function updateClock(){

    const now =
        new Date();


    const hours =
        String(
            now.getHours()
        ).padStart(
            2,
            "0"
        );


    const minutes =
        String(
            now.getMinutes()
        ).padStart(
            2,
            "0"
        );


    const seconds =
        String(
            now.getSeconds()
        ).padStart(
            2,
            "0"
        );


    document
        .getElementById("clock")
        .textContent =
        `${hours}:${minutes}:${seconds}`;

}


updateClock();


setInterval(
    updateClock,
    1000
);


/* =====================================================
   CHUYỂN TRANG
===================================================== */

function showPage(page){

    document
        .querySelectorAll(".page")
        .forEach(
            function(item){

                item.classList
                    .remove("active");

            }
        );


    document
        .getElementById(page)
        .classList
        .add("active");

}


/* =====================================================
   XOAY THIẾT BỊ
===================================================== */

const water =
    document.getElementById(
        "water"
    );


const boat =
    document.getElementById(
        "boat"
    );


const clockBox =
    document.getElementById(
        "clockBox"
    );


function moveWater(angle){

    /*
       Giới hạn góc.
       Nước sẽ không nghiêng quá mạnh.
    */

    let tilt =
        Math.max(
            -25,
            Math.min(
                25,
                angle
            )
        );


    /*
       NƯỚC NGHIÊNG
    */

    water.style.transform =
        `rotate(${tilt}deg) scale(1.15)`;


    /*
       THUYỀN NGHIÊNG THEO NƯỚC
    */

    boat.style.transform =
        `translateX(-50%) rotate(${tilt}deg)`;


    /*
       KHUNG ĐỒNG HỒ
       CHỈ NGHIÊNG RẤT NHẸ
    */

    clockBox.style.transform =
        `rotate(${tilt * .08}deg)`;

}


/* =====================================================
   CẢM BIẾN XOAY
===================================================== */

function orientationHandler(event){

    /*
       gamma:
       nghiêng trái/phải của thiết bị
    */

    const angle =
        event.gamma || 0;


    moveWater(angle);

}


/* =====================================================
   KÍCH HOẠT CẢM BIẾN
===================================================== */

async function enableMotion(){

    /*
       iPhone / iPad
    */

    if(
        typeof DeviceOrientationEvent !==
        "undefined"
        &&
        typeof DeviceOrientationEvent
            .requestPermission ===
        "function"
    ){

        try{

            const permission =
                await DeviceOrientationEvent
                    .requestPermission();


            if(
                permission ===
                "granted"
            ){

                window.addEventListener(
                    "deviceorientation",
                    orientationHandler
                );

            }

        }
        catch(error){

            console.log(error);

        }

    }

    /*
       Android / trình duyệt hỗ trợ sẵn
    */

    else{

        window.addEventListener(
            "deviceorientation",
            orientationHandler
        );

    }

}


/*
   Kích hoạt cảm biến sau
   lần chạm đầu tiên.
*/

document.addEventListener(
    "click",
    enableMotion,
    {
        once:true
    }
);

</script>

</body>
</html>
